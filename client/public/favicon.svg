<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Calendar body (white card) -->
  <rect x="11" y="18" width="42" height="33" rx="5" fill="white" fill-opacity="0.95"/>

  <!-- Calendar header bar (accent strip at top) -->
  <rect x="11" y="18" width="42" height="11" rx="5" fill="white" fill-opacity="0.15"/>
  <rect x="11" y="23" width="42" height="6" fill="white" fill-opacity="0.15"/>

  <!-- Hanger pegs -->
  <rect x="21" y="13" width="4" height="10" rx="2" fill="white" fill-opacity="0.9"/>
  <rect x="39" y="13" width="4" height="10" rx="2" fill="white" fill-opacity="0.9"/>

  <!-- Grid dots (calendar day cells) -->
  <!-- Row 1 -->
  <rect x="17" y="34" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="26" y="34" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="35" y="34" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="44" y="34" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
  <!-- Row 2 -->
  <rect x="17" y="42" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
  <!-- Highlighted "today" cell -->
  <rect x="26" y="42" width="6" height="5" rx="1.5" fill="#7c3aed"/>
  <rect x="35" y="42" width="6" height="5" rx="1.5" fill="#7c3aed" fill-opacity="0.18"/>
</svg>