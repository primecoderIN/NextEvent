<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover and book amazing events happening around you — music, sports, workshops, nightlife and more." />
    <meta name="theme-color" content="#7c3aed" />
    <title>NextEvent — Discover Amazing Events</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
      }
      #root {
        min-height: 100vh;
      }
      .app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
      }
      .app-boot-loader__spinner {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-boot-loader__spinner::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid rgba(124, 58, 237, 0.2); /* Muted purple */
        border-top-color: #7c3aed; /* Vibrant purple */
        animation: app-boot-spin 1s linear infinite;
      }
      .app-boot-loader__icon {
        position: absolute;
        width: 42px;
        height: 42px;
        opacity: 0;
        /* 3 seconds total duration, matching the 3 icons */
        animation: app-boot-cycle 3s infinite;
        animation-fill-mode: both;
      }
      /* Staggered delay for the 3 icons */
      .app-boot-loader__icon:nth-child(1) { animation-delay: 0s; color: #a855f7; }
      .app-boot-loader__icon:nth-child(2) { animation-delay: 1s; color: #ec4899; }
      .app-boot-loader__icon:nth-child(3) { animation-delay: 2s; color: #06b6d4; }
      
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      
      /* Each icon takes exactly 1/3rd (33.3%) of the 3s cycle to appear, hold, and fade */
      @keyframes app-boot-cycle {
        0% { opacity: 0; transform: scale(0.75); }
        10% { opacity: 1; transform: scale(1.1); }
        25% { opacity: 1; transform: scale(1); }
        33% { opacity: 0; transform: scale(0.75); }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite" aria-label="Loading application">
        <div class="app-boot-loader__spinner">
          <!-- Calendar Icon -->
          <svg class="app-boot-loader__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          
          <!-- Music Note Icon -->
          <svg class="app-boot-loader__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          
          <!-- Ticket Icon -->
          <svg class="app-boot-loader__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5v2"></path>
            <path d="M15 11v2"></path>
            <path d="M15 17v2"></path>
            <path d="M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"></path>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
