services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nextevent-rabbitmq
    ports:
      # AMQP protocol port (used by MassTransit/application)
      - "5672:5672"
      # Management UI port (accessible via browser at http://localhost:15672)
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nextevent-redis
    ports:
      # Redis default port — used by the API via IDistributedCache / StackExchange.Redis
      - "6379:6379"
    # Persist data across container restarts using a named volume
    volumes:
      - redis_data:/data
    # Enable AOF persistence so cache survives a restart (optional but recommended)
    command: redis-server --appendonly yes
    restart: unless-stopped

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nextevent-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend-api:
    build: 
      context: .
      dockerfile: API/Dockerfile
    container_name: nextevent-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=NextEventDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - Redis__ConnectionString=redis:6379
      - TokenKey=${TOKEN_KEY}
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  frontend-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nextevent-client
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  redis_data:
  sql-data:
